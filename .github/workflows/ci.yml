name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── C build + unit tests ──────────────────────────────────────
  c-build-test:
    name: C Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build monitor
        run: make monitor

      - name: Run C unit tests
        run: make -C tests/unit run_tests

  # ── Python tests ─────────────────────────────────────────────
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r src/dashboard/requirements.txt

      - name: Run Python tests
        run: pytest tests/python/ -v
